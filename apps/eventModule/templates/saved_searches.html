{% extends 'base.html' %}
{% load static %}

{% block meta %}
<title>gas.in | My Saved Searches</title>
{% endblock meta %}

{% block content %}
<!-- {% include 'toast.html' %} -->

<div class="relative min-h-screen pt-32 pb-20 px-20 max-lg:px-12 flex flex-col gap-10">
    <div class="flex flex-col gap-2">
        <h2 class="text-3xl max-md:text-2xl font-bold">My Saved Searches</h2>
        <p class="text-gray-500">Quick access to your favorite event filters</p>
    </div>

    <div id="saved-searches-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Saved searches will be loaded here -->
    </div>

    <div id="empty-state" class="text-center py-12 hidden">
        <svg class="mx-auto h-16 w-16 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path>
        </svg>
        <h3 class="mt-4 text-xl font-semibold text-gray-900">No saved searches yet</h3>
        <p class="mt-2 text-lg text-gray-500">Save your favorite filters for quick access</p>
        <a href="{% url 'eventModule:show_discover' %}" class="mt-4 inline-block px-6 py-2 bg-gray-800 text-white rounded-lg hover:bg-gray-900">
            Go to Discovery
        </a>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', loadSavedSearches);

async function loadSavedSearches() {
    try {
        const response = await fetch('/event/api/saved-search/');
        const result = await response.json();
        
        const container = document.getElementById('saved-searches-container');
        const emptyState = document.getElementById('empty-state');
        
        if (result.data.length === 0) {
            emptyState.classList.remove('hidden');
            return;
        }
        
        emptyState.classList.add('hidden');
        container.innerHTML = '';
        
        result.data.forEach(search => {
            const card = createSearchCard(search);
            container.appendChild(card);
        });
    } catch (error) {
        console.error('Error loading saved searches:', error);
        showToast('Error', 'Gagal memuat saved searches', 'error');
    }
}

function createSearchCard(search) {
    const card = document.createElement('div');
    card.className = 'bg-white rounded-lg border-2 border-gray-300 p-6 hover:border-gray-500 transition';
    
    const filters = [];
    if (search.location) filters.push(`📍 ${search.location}`);
    if (search.category) filters.push(`🏃 ${getCategoryLabel(search.category)}`);
    
    card.innerHTML = `
        <h3 class="text-xl font-bold mb-3">${search.name}</h3>
        <div class="text-gray-600 mb-4">
            ${filters.length > 0 ? filters.join(' • ') : 'All events'}
        </div>
        <div class="flex gap-2">
            <button 
                onclick="applySavedSearch('${search.location || ''}', '${search.category || ''}')"
                class="flex-1 bg-gray-800 text-white py-2 rounded-lg font-semibold hover:bg-gray-900">
                Apply
            </button>
            <button 
                onclick="deleteSavedSearch('${search.id}')"
                class="px-4 bg-red-100 text-red-600 rounded-lg hover:bg-red-200">
                🗑️
            </button>
        </div>
    `;
    
    return card;
}

function applySavedSearch(location, category) {
    const params = new URLSearchParams();
    if (location) params.append('location', location);
    if (category) params.append('category', category);
    
    showToast('Filter Applied', 'Menerapkan filter...', 'info');
    setTimeout(() => {
        window.location.href = `/event/?${params.toString()}`;
    }, 500);
}

async function deleteSavedSearch(id) {
    if (!confirm('Are you sure you want to delete this saved search?')) return;
    
    try {
        const response = await fetch(`/event/api/saved-search/${id}/delete/`, {
            method: 'POST',
            headers: {
                'X-CSRFToken': getCookie('csrftoken')
            }
        });
        
        if (response.ok) {
            showToast('Deleted!', 'Saved search berhasil dihapus', 'success');
            loadSavedSearches();
        } else {
            showToast('Error', 'Gagal menghapus saved search', 'error');
        }
    } catch (error) {
        console.error('Error:', error);
        showToast('Error', 'Terjadi kesalahan', 'error');
    }
}

function getCategoryLabel(value) {
    const categories = {
        'running': 'Lari',
        'badminton': 'Badminton',
        'futsal': 'Futsal',
        'football': 'Sepak Bola',
        'basketball': 'Basket',
        'cycling': 'Sepeda',
        'volleyball': 'Voli',
        'yoga': 'Yoga',
        'padel': 'Padel',
        'other': 'Lainnya'
    };
    return categories[value] || value;
}

function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}
</script>
{% endblock content %}
